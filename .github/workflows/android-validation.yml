name: Validate published Android APK

on:
  push:
    paths:
      - 'android/**'
      - 'scripts/validate_android_apk.py'
      - '.github/workflows/android-validation.yml'
      - 'downloads/PrismScope-*.apk'
      - 'downloads/latest-android.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select published version
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('downloads/latest-android.json').read_text())['version_code']
          assert isinstance(version, int) and version > 0
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'BUILD_NUMBER={version}\n')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use hosted Android SDK
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          output = Path('out/android-validation')
          output.mkdir(parents=True, exist_ok=True)
          try:
              sdk = Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
              manager = sdk / 'cmdline-tools/latest/bin/sdkmanager'
              assert manager.is_file(), f'Hosted sdkmanager missing: {manager}'
              with open(os.environ['GITHUB_PATH'], 'a') as paths:
                  paths.write(f'{manager.parent}\n{sdk / "platform-tools"}\n{sdk / "emulator"}\n')
              for args in [[str(manager), '--version'], [str(manager), '--licenses']]:
                  result = subprocess.run(args, input='y\n' * 100, text=True,
                                          stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  with (output / 'sdk-setup.log').open('a') as log:
                      log.write(result.stdout)
                  print(result.stdout)
                  result.check_returncode()
          except Exception as error:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('SDK setup failed: ' + str(error) + '\n\n')
                  log = output / 'sdk-setup.log'
                  if log.exists(): summary.write('```text\n' + log.read_text()[-6000:] + '\n```\n')
              raise
          PY
      - uses: gradle/actions/setup-gradle@v4
      - name: Build instrumentation APK
        working-directory: android
        run: |
          mkdir -p ../out/android-validation
          if ! ./gradlew --no-daemon --max-workers=2 --console=plain :app:assembleReleaseAndroidTest > ../out/android-validation/gradle.log 2>&1; then
            tail -n 80 ../out/android-validation/gradle.log >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Set up accelerated Android 11
        run: |
          trap 'tail -n 60 out/android-validation/emulator-setup.log >> "$GITHUB_STEP_SUMMARY"' ERR
          exec > >(tee out/android-validation/emulator-setup.log) 2>&1
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager 'emulator' 'system-images;android-30;default;x86_64'
          echo no | avdmanager create avd --force --name PrismValidation --package 'system-images;android-30;default;x86_64' --device pixel_4
          mkdir -p out/android-validation
          "$ANDROID_HOME/emulator/emulator" -avd PrismValidation -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics -accel on -gpu swiftshader_indirect -memory 3072 -cores 2 -camera-back emulated -camera-front none -skin 720x1280 -dpi-device 280 > out/android-validation/emulator.log 2>&1 &
      - name: Verify exact download APK and run Android tests
        run: python3 scripts/validate_android_apk.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-apk-validation
          path: out/android-validation/
