name: Build APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # 릴리스 키스토어는 저장소에 없다. Secrets 에 있으면 복원해서 쓰고,
      # 없으면 디버그 키로 서명한 뒤 그 사실을 릴리스 노트에 표시한다.
      - name: Restore release keystore
        id: keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signed_with=릴리스 키 (GitHub Secrets)" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "signed_with=디버그 키 (RELEASE_KEYSTORE_BASE64 시크릿 미설정)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        working-directory: android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          RELEASE_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Collect APK and AAB
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk \
             "out/PrismScope-b${{ github.run_number }}.apk"
          # AAB 는 Play Console 업로드용이다. 사이드로드에는 쓸 수 없다.
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "out/PrismScope-b${{ github.run_number }}.aab"

      # 주장이 아니라 검증. 빌드된 APK 를 직접 뜯어서 확인하고,
      # 하나라도 어긋나면 빌드를 실패시켜 배포되지 않게 한다.
      - name: Verify APK safety properties
        id: verify
        run: |
          set -euo pipefail
          APK=$(ls out/*.apk)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          AAPT="$BT/aapt2"
          APKSIGNER="$BT/apksigner"

          echo "::group::선언된 권한"
          PERMS=$("$AAPT" dump permissions "$APK")
          echo "$PERMS"
          echo "::endgroup::"

          fail=0
          for p in INTERNET ACCESS_NETWORK_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION \
                   READ_PHONE_STATE RECORD_AUDIO READ_CONTACTS READ_SMS; do
            if echo "$PERMS" | grep -q "android.permission.$p\b"; then
              echo "::error::금지된 권한이 APK 에 포함됨: $p"
              fail=1
            fi
          done

          echo "::group::badging"
          BADGING=$("$AAPT" dump badging "$APK")
          echo "$BADGING" | head -30
          echo "::endgroup::"

          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "::error::debuggable 플래그가 켜져 있음"
            fail=1
          fi

          echo "::group::서명 검증"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signer.txt
          echo "::endgroup::"

          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          CERT=$(grep -m1 -i "SHA-256 digest:" signer.txt | awk '{print $NF}' || echo "unknown")
          echo "apk_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT" >> "$GITHUB_OUTPUT"

          if [ "$fail" -ne 0 ]; then
            echo "안전성 검사 실패 — 배포하지 않는다"
            exit 1
          fi
          echo "안전성 검사 통과"

      # 이 APK 가 이 저장소의 이 커밋에서 이 워크플로로 빌드됐음을 서명으로 증명한다.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: out/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrismScope-apk
          path: |
            out/*.apk
            out/*.aab

      - name: Publish to apk-latest release
        if: github.ref_name == 'claude/transparent-prism-surface-inspection-1s9537' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BUILD: ${{ github.run_number }}
          APK_SHA: ${{ steps.verify.outputs.apk_sha256 }}
          CERT_SHA: ${{ steps.verify.outputs.cert_sha256 }}
          SIGNED_WITH: ${{ steps.keystore.outputs.signed_with }}
        run: |
          {
            echo "빌드 $BUILD · 브랜치 \`$BRANCH\` · 커밋 \`$SHA\`"
            echo
            echo "## 이 APK 의 안전성"
            echo
            echo "빌드할 때마다 CI 가 아래를 **APK 를 직접 뜯어서** 확인하고, 하나라도 어긋나면 배포하지 않습니다."
            echo
            echo "- **네트워크 권한 없음** — INTERNET 권한이 없어 어떤 서버와도 통신할 수 없습니다. 촬영한 검사 이미지가 밖으로 나갈 경로가 존재하지 않습니다."
            echo "- **위치·마이크·연락처·전화 권한 없음** — 요구하는 권한은 카메라 하나뿐입니다."
            echo "- **debuggable 아님** — 릴리스 빌드라 다른 앱이 프로세스 메모리를 들여다볼 수 없습니다."
            echo "- **백업 비활성화** — 검사 이미지가 클라우드로 백업되지 않습니다."
            echo "- **빌드 출처 증명(attestation)** 첨부 — 이 저장소의 위 커밋에서 빌드됐음이 서명으로 증명됩니다."
            echo "- **전체 소스 공개** — \`android/\` 아래에 이 APK 를 만든 코드 전부가 있습니다."
            echo
            echo "서명 키: $SIGNED_WITH"
            echo
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| APK SHA-256 | \`$APK_SHA\` |"
            echo "| 서명 인증서 SHA-256 | \`$CERT_SHA\` |"
            echo
            echo "다운로드한 파일이 위 SHA-256 과 같은지 확인하면 전송 중 변조되지 않았음을 알 수 있습니다."
            echo "서명 인증서 값은 매 업데이트마다 같아야 합니다. 달라지면 다른 사람이 만든 APK입니다."
            echo
            echo "## 설치 방법 (갤럭시 Z 폴드 7)"
            echo
            echo "1. **설정 → 보안 및 개인정보 보호 → 자동 차단(Auto Blocker) → 끄기**"
            echo "   삼성 자동 차단이 켜져 있으면 스토어 외 앱 설치가 전면 차단됩니다. 이것 때문에 설치가 안 됩니다."
            echo "2. 아래 \`.apk\` 파일을 눌러 다운로드"
            echo "3. \"이 출처의 앱 설치 허용\"이 뜨면 사용 중인 브라우저를 허용"
            echo "4. Play Protect 경고가 뜨면 **자세히 → 무시하고 설치**"
            echo "   (스토어에 등록되지 않은 앱이라 뜨는 경고이며, 악성 코드가 발견됐다는 뜻이 아닙니다)"
            echo "5. **\"무시하고 설치\" 선택지 없이 그냥 막히면** — Play 스토어 → 우측 상단 프로필 →"
            echo "   Play 프로텍트 → 우측 상단 톱니 → **\"기기 유해 앱 검사\" 끄기** → 설치 → 다시 켜기"
            echo "6. 설치 후 **자동 차단을 다시 켜셔도 됩니다.** 이미 설치된 앱은 유지됩니다."
            echo "   단 다음 업데이트 때 다시 잠시 꺼야 합니다."
            echo
            echo "### 그래도 안 되면 — PC 에서 ADB 설치 (가장 확실함)"
            echo
            echo "폰: 설정 → 휴대전화 정보 → 소프트웨어 정보 → 빌드번호 7회 탭 → 개발자 옵션 → **USB 디버깅 켜기**"
            echo
            echo "\`\`\`"
            echo "adb install -r PrismScope-b$BUILD.apk"
            echo "\`\`\`"
            echo
            echo "ADB 설치는 Play Protect 의 설치 차단을 거치지 않습니다. 검사 폰에는 이 방법이 가장 안정적입니다."
            echo
            echo "같은 서명 키를 쓰므로 기존 앱 위에 덮어쓰기 설치됩니다. 지울 필요 없습니다."
            echo
            echo "## 자동 업데이트"
            echo
            echo "**Obtainium** 을 쓰면 새 빌드가 나올 때마다 폰이 알려주고 한 번 눌러 업데이트할 수 있습니다."
            echo "이 앱 자체는 네트워크 권한이 없으므로, 업데이트 확인은 Obtainium 이 대신합니다."
            echo
            echo "1. Obtainium 설치 — https://github.com/ImranR98/Obtainium/releases/latest"
            echo "2. Obtainium → **+** → App Source URL 에 아래 주소 입력 → **Add**"
            echo "   \`https://github.com/seunghyuk09/PrismTest\`"
            echo "3. 새 빌드가 올라오면 Obtainium 이 알림을 띄웁니다"
            echo
            echo "자세한 내용과 Play 내부 테스트 방식은 \`docs/auto-update.md\` 참조."
            echo
            echo "## .aab 파일은 무엇인가"
            echo
            echo "\`.aab\` 는 **Google Play Console 업로드 전용**입니다. 폰에 직접 설치할 수 없습니다."
            echo "Play 내부 테스트로 배포하면 자동 차단·Play Protect 경고 없이 설치되고 업데이트도 자동으로 내려갑니다."
            echo "절차는 저장소의 \`docs/play-release.md\` 를 보십시오."
          } > notes.md
          # 버전별 태그로 릴리스한다. 고정 태그(apk-latest)로 덮어쓰면
          # Obtainium 같은 업데이터가 버전이 올라간 것을 인식하지 못한다.
          gh release create "v$BUILD" \
            --latest \
            --title "PrismScope v0.1.$BUILD" \
            --notes-file notes.md \
            out/*.apk out/*.aab
          # 이전 방식의 고정 태그가 남아 있으면 혼동되므로 정리한다.
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
